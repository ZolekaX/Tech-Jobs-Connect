<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Registration - Tech Jobs Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
     <body style="background-color: grey;"></body>
    <img src="images/LOGO.png " width="200px" height="300px">
    <h1>Tech Jobs Connect</h1>
</header>

<main>
    <h2>Job Seeker Registration</h2>

    <form action="#" method="post" enctype="multipart/form-data">

        <label>Full Name:</label>
        <input type="text" name="fullname" required>

        <label>Email Address:</label>
        <input type="email" name="email" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <label>Highest Qualification:</label>
        <input type="text" name="qualification">

        <label>Skills:</label>
        <textarea name="skills" placeholder="List your skills"></textarea>

        <label>Upload CV:</label>
        <input type="file" name="cv" accept=".pdf,.doc,.docx">

        <button type="submit">Create Account</button>

    </form>
</main>

<footer>
    <p>&copy; 2026 Tech Jobs Connect. All Rights Reserved.</p>
</footer>

</body>
</html>
