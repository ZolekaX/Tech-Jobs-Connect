<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tech Jobs Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images/LOGO.png " width="200px" height="300px">
    <h1>Tech Jobs Connect</h1>
</header>

<main>
    <h2>Contact Us</h2>

    <section>
        <h3>Get in Touch</h3>

        <p><strong>Email:</strong> info@techjobsconnect.co.za</p>
        <p><strong>Phone:</strong> +27601931284</p>
        <p><strong>Office Hours:</strong> Monday - Friday, 08:00 - 17:00</p>
    </section>

    <h3>Send an Enquiry</h3>

    <form action="#" method="post">

        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Subject:</label>
        <input type="text" name="subject" required>

        <label>Message:</label>
        <textarea name="message" rows="6" required></textarea>

        <button type="submit">Send Enquiry</button>

    </form>
</main>

<footer>
    <p>&copy; 2026 Tech Jobs Connect. All Rights Reserved.</p>
</footer>

</body>
</html>
