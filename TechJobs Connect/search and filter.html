<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Jobs - Tech Jobs Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images/LOGO.png " width="200px" height="300px">
    <h1>Tech Jobs Connect</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="job-listings.html">Jobs</a>
        <a href="search-filter.html">Search</a>
        <a href="about-us.html">About Us</a>
        <a href="contact-us.html">Contact</a>
    </nav>
</header>

<main>
    <h2>Search and Filter Jobs</h2>

    <form>
        <label>Keywords:</label>
        <input type="text" placeholder="e.g. Java Developer">

        <label>Location:</label>
        <input type="text" placeholder="e.g. Johannesburg">

        <label>Job Category:</label>
        <select>
            <option>All Categories</option>
            <option>Software Development</option>
            <option>IT Support</option>
            <option>Cyber Security</option>
            <option>Data Analytics</option>
            <option>Web Development</option>
        </select>

        <label>Experience Level:</label>
        <select>
            <option>All Levels</option>
            <option>Entry Level</option>
            <option>Junior</option>
            <option>Intermediate</option>
            <option>Senior</option>
        </select>

        <label>Employment Type:</label>
        <select>
            <option>All Types</option>
            <option>Full Time</option>
            <option>Part Time</option>
            <option>Contract</option>
            <option>Internship</option>
        </select>

        <button type="submit">Search Jobs</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Tech Jobs Connect. All Rights Reserved.</p>
</footer>

</body>
</html>
